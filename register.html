<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tododay — Daftar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card auth-card">
    <p class="host">tododay.rakit.icu</p>
    <p id="live-clock" class="live-clock"></p>
    <h1>📝 Daftar Akun</h1>

    <div id="auth-error" class="auth-error" hidden></div>

    <form id="register-form" class="auth-form">
      <label class="auth-label" for="reg-name">Nama (opsional)</label>
      <input id="reg-name" type="text" placeholder="Nama kamu" autocomplete="name" />

      <label class="auth-label" for="reg-email">Email</label>
      <input id="reg-email" type="email" placeholder="email@contoh.com" autocomplete="email" required />

      <label class="auth-label" for="reg-username">Username</label>
      <input id="reg-username" type="text" placeholder="username" autocomplete="username" required />

      <label class="auth-label" for="reg-password">Password</label>
      <input id="reg-password" type="password" placeholder="min. 6 karakter" autocomplete="new-password" required />

      <button type="submit" class="auth-submit">Daftar</button>
    </form>

    <p class="auth-switch">
      Sudah punya akun?
      <a href="login.html" class="link">Masuk</a>
    </p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
