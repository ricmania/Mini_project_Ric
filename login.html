<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tododay — Masuk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card auth-card">
    <p class="host">tododay.rakit.icu</p>
    <p id="live-clock" class="live-clock"></p>
    <h1>🔐 Masuk</h1>

    <div id="auth-error" class="auth-error" hidden></div>

    <form id="login-form" class="auth-form">
      <label class="auth-label" for="login-username">Username atau Email</label>
      <input id="login-username" type="text" placeholder="username atau email" autocomplete="username" required />

      <label class="auth-label" for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />

      <button type="submit" class="auth-submit">Masuk</button>
    </form>

    <p class="auth-switch">
      Belum punya akun?
      <a href="register.html" class="link">Daftar</a>
    </p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
